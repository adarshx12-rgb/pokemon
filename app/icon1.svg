<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5d77a"/>
      <stop offset=".5" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#8c6b1f"/>
    </linearGradient>
    <linearGradient id="streak" x1="1" y1="0" x2="0" y2="1">
      <stop offset=".18" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".42" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- The grail card's back: black face, double gold frame, diagonal sheen -->
  <g transform="rotate(-10 16 16)">
    <rect x="5.5" y="1.5" width="21" height="29" rx="2.6" fill="url(#gold)"/>
    <rect x="6.9" y="2.9" width="18.2" height="26.2" rx="1.7" fill="#050507"/>
    <rect x="8.1" y="4.1" width="15.8" height="23.8" rx="1.1" fill="none" stroke="url(#gold)" stroke-width=".5" opacity=".75"/>
    <rect x="6.9" y="2.9" width="18.2" height="26.2" rx="1.7" fill="url(#streak)"/>
  </g>
</svg>
